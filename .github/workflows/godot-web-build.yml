name: Godot Web Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy to GitHub Pages (enable Pages → GitHub Actions first)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anomaly-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Import project and build web export
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path game --quit
          mkdir -p public/game
          cp index.html public/index.html
          cp -R assets public/assets
          godot --headless --path game --export-release "Web" "$GITHUB_WORKSPACE/public/game/index.html"
          test -s public/game/index.html
          find public/game -maxdepth 1 -type f -printf '%f %k KB\n'

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-web-build
          path: public/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: ${{ inputs.publish }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.publish }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        if: ${{ inputs.publish }}
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
